<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Store</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="12favicon.png" type="image/png">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>My Store</h1>
      <input type="text" id="username" placeholder="Username or Email" />
      <input type="password" id="password" placeholder="Password" />
      <button onclick="loginUser()">Login</button>
      <p id="error-message" style="color: red; margin-top: 10px;"></p>
    </div>
  </div>

  <!-- Firebase SDKs (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- Firebase Config -->
  <script src="firebase-config.js"></script>

  <!-- Login Logic -->
  <script>
    async function loginUser() {
      const userInput = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-message');

      errorMsg.innerText = ''; // Clear previous error

      if (!userInput || !password) {
        errorMsg.innerText = 'Please enter both username/email and password.';
        return;
      }

      try {
        let targetEmail = userInput;
        let loggedUsername = userInput;

        // Input එක Email එකක් නෙමෙයි නම් (Username එකක් නම්) Firestore එකෙන් Email එක හොයයි
        if (!userInput.includes('@')) {
          const userSnapshot = await db.collection('users')
            .where('username', '==', userInput)
            .limit(1)
            .get();

          if (userSnapshot.empty) {
            errorMsg.innerText = 'Invalid username or credentials.';
            return;
          }

          const userData = userSnapshot.docs[0].data();
          targetEmail = userData.email;
          loggedUsername = userData.username || userInput;
        }

        // Firebase Auth හරහා Login වීම
        const userCredential = await auth.signInWithEmailAndPassword(targetEmail, password);
        
        // Firestore එකෙන් User role එක ලබාගැනීම
        const userDoc = await db.collection('users').doc(userCredential.user.uid).get();
        let userRole = 'user';
        
        if (userDoc.exists && userDoc.data().role) {
          userRole = userDoc.data().role;
        }

        // Session storage එකේ data save කිරීම
        sessionStorage.setItem('username', loggedUsername);
        sessionStorage.setItem('role', userRole);

        // Dashboard එකට මාරු කිරීම
        window.location.href = 'dashboard.html';

      } catch (error) {
        console.error("Login Error:", error);
        errorMsg.innerText = error.message;
      }
    }
  </script>
</body>
</html>
