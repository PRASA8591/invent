<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test Users - Firebase View</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
    table { border-collapse: collapse; width: 100%; background: white; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background-color: #007bff; color: white; }
  </style>
  <link rel="icon" href="12favicon.png" type="image/png">
</head>
<body>
  <h2>🔍 Firestore Users Debug Table</h2>
  <table>
    <thead>
      <tr><th>Username</th><th>Email</th><th>Role</th></tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>

  <!-- Firebase Modular SDK Script (type="module" ලෙස) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3fhxeSNb8MBqkmSsA55XCZaziRQm_FPk",
      authDomain: "inventory-new-379dc.firebaseapp.com",
      projectId: "inventory-new-379dc",
      storageBucket: "inventory-new-379dc.firebasestorage.app",
      messagingSenderId: "922542802053",
      appId: "1:922542802053:web:4058f53a678787207495ec",
      measurementId: "G-728ZE17NHY"
    };

    // Firebase Initialize කිරීම
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Firestore වෙතින් Users Data ලබාගැනීම
    async function loadUsers() {
      try {
        const querySnapshot = await getDocs(collection(db, 'users'));
        const table = document.getElementById('userTable');
        
        querySnapshot.forEach(doc => {
          const user = doc.data();
          const row = `<tr>
            <td>${user.username || ''}</td>
            <td>${user.email || ''}</td>
            <td>${user.role || ''}</td>
          </tr>`;
          table.innerHTML += row;
        });
      } catch (err) {
        document.body.innerHTML += '<p style="color:red;">Error: ' + err.message + '</p>';
      }
    }

    loadUsers();
  </script>
</body>
</html>
